<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dopagakihataerenairasiiyoWW</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        /* ヘッダーエリア */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #30363d;
        }
        .top-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        #best-roll-display {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        #total-rolls-display {
            font-size: 16px;
            font-weight: bold;
            color: #58a6ff;
        }
        /* 中央表示エリア */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        #result-card {
            text-align: center;
            animation: popIn 0.3s ease-out;
        }
        #result-number {
            font-size: 56px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
            transition: color 0.2s;
            word-break: break-all;
            max-width: 90vw;
            line-height: 1.2;
        }
        /* 最下部操作エリア */
        footer {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            z-index: 10;
        }
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
        }
        .action-btn {
            flex: 1;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        #roll-btn {
            background: linear-gradient(135deg, #238636, #2ea44f);
            color: white;
        }
        #roll-btn:disabled {
            background: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }
        #auto-btn {
            background: #388bfd;
            color: white;
        }
        #auto-btn.active {
            background: #da3633;
        }
        /* クールダウンバー */
        .cooldown-container {
            width: 100%;
            height: 6px;
            background-color: #21262d;
            border-radius: 3px;
            overflow: hidden;
        }
        #cooldown-bar {
            width: 0%;
            height: 100%;
            background-color: #2ea44f;
            transition: width linear;
        }
        /* インベントリ (左側) */
        .panel {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 320px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        #inventory-panel { left: 0; transform: translateX(-100%); }
        #inventory-panel.open { transform: translateX(0); }
        /* アップグレードツリー (右側) */
        #upgrade-panel { right: 0; transform: translateX(100%); }
        #upgrade-panel.open { transform: translateX(0); }
        
        .panel-header {
            padding: 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .item-row, .upg-card {
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .upg-card h4 { color: #fff; margin-bottom: 5px; }
        .upg-card p { font-size: 13px; color: #8b949e; margin-bottom: 10px; }
        
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <button class="btn" id="open-inv-btn" onclick="togglePanel('inventory-panel', true)">🎒 インベントリ</button>
        <div class="top-center">
            <div id="best-roll-display">👑 Best: 1</div>
            <div id="total-rolls-display">⭐ Total Rolls: 0</div>
        </div>
        <button class="btn" onclick="togglePanel('upgrade-panel', true)">🆙 強化</button>
    </header>

    <!-- 中央ガチャ表示 -->
    <main>
        <div id="result-card">
            <div id="result-number">1</div>
        </div>
    </main>

    <!-- 最下部操作UI -->
    <footer>
        <div class="controls">
            <button class="action-btn" id="roll-btn" onclick="triggerRoll()">ROLL</button>
            <button class="action-btn" id="auto-btn" onclick="toggleAuto()">AUTO: OFF</button>
        </div>
        <div class="cooldown-container">
            <div id="cooldown-bar"></div>
        </div>
    </footer>

    <!-- 左インベントリパネル -->
    <div class="panel" id="inventory-panel">
        <div class="panel-header">
            <h3>🎒 インベントリ</h3>
            <button class="btn" onclick="togglePanel('inventory-panel', false)">×</button>
        </div>
        <div class="panel-content" id="inventory-list"></div>
    </div>

    <!-- 右アップグレードツリーパネル -->
    <div class="panel" id="upgrade-panel">
        <div class="panel-header">
            <h3>🆙 無限強化ツリー</h3>
            <button class="btn" onclick="togglePanel('upgrade-panel', false)">×</button>
        </div>
        <div class="panel-content">
            <div class="upg-card">
                <h4>⚡ タイムリープ (速度UP)</h4>
                <p>ロールの待ち時間を短縮します。</p>
                <div id="speed-level">Lv.0</div>
                <button class="btn" style="width:100%; margin-top:8px;" id="buy-speed-btn" onclick="buyUpgrade('speed')">コスト: 10 Rolls</button>
            </div>
            <div class="upg-card">
                <h4>🍀 フォーチュン・オーラ (幸運度UP)</h4>
                <p>より大きな数字が出やすくなります。</p>
                <div id="luck-level">Lv.0</div>
                <button class="btn" style="width:100%; margin-top:8px;" id="buy-luck-btn" onclick="buyUpgrade('luck')">コスト: 15 Rolls</button>
            </div>
        </div>
    </div>

    <script>
        // Septillionまでのレアリティデータ (全16段階)
        const pool = [
            { value: "1,000,000,000,000,000,000,000,000", numeric: 1e24, chance: 1 / 1e24, color: '#ff3e6c' }, // Septillion
            { value: "1,000,000,000,000,000,000,000",     numeric: 1e21, chance: 1 / 1e21, color: '#ff3eac' }, // Sextillion
            { value: "1,000,000,000,000,000,000",         numeric: 1e18, chance: 1 / 1e18, color: '#ff3eeb' }, // Quintillion
            { value: "1,000,000,000,000,000",             numeric: 1e15, chance: 1 / 1e15, color: '#bd3eff' }, // Quadrillion
            { value: "1,000,000,000,000",                 numeric: 1e12, chance: 1 / 1e12, color: '#7b3eff' }, // Trillion
            { value: "1,000,000,000",                     numeric: 1e9,  chance: 1 / 1e9,  color: '#3e5eff' }, // Billion
            { value: "1,000,000",                         numeric: 1e6,  chance: 1 / 1e6,  color: '#3e9bff' }, // Million
            { value: "100,000",                           numeric: 100000, chance: 1 / 100000, color: '#3ed6ff' },
            { value: "10,000",                            numeric: 10000,  chance: 1 / 10000,  color: '#3effc3' },
            { value: "1,000",                             numeric: 1000,   chance: 1 / 1000,   color: '#3eff68' },
            { value: "100",                               numeric: 100,    chance: 1 / 100,    color: '#9fff3e' },
            { value: "25",                                numeric: 25,     chance: 1 / 25,     color: '#e1ff3e' },
            { value: "10",                                numeric: 10,     chance: 1 / 10,     color: '#ffdf3e' },
            { value: "5",                                 numeric: 5,      chance: 1 / 5,      color: '#ffa23e' },
            { value: "1",                                 numeric: 1,      chance: 1 / 1,      color: '#ffffff' }
        ];

        // ゲームステート初期値
        let state = {
            rolls: 0,
            bestRollVal: "1",
            bestRollNum: 1,
            inventory: {},
            upgrades: { speed: 0, luck: 0 }
        };

        let isRolling = false;
        let isAuto = false;

        // セーブとロードの処理
        function saveGame() {
            localStorage.setItem('rng_game_save_v4_septillion', JSON.stringify(state));
        }

        function loadGame() {
            const saved = localStorage.getItem('rng_game_save_v4_septillion');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed === 'object') {
                        state.rolls = parsed.rolls || 0;
                        state.bestRollVal = parsed.bestRollVal || "1";
                        state.bestRollNum = parsed.bestRollNum || 1;
                        state.inventory = parsed.inventory || {};
                        state.upgrades = parsed.upgrades || { speed: 0, luck: 0 };
                    }
                } catch(e) { console.error(e); }
            }
            updateUI();
        }

        // 開閉パネル制御
        function togglePanel(id, show) {
            document.getElementById(id).classList.toggle('open', show);
            if (id === 'inventory-panel' && show) {
                document.getElementById('open-inv-btn').style.visibility = 'hidden';
            } else if (id === 'inventory-panel' && !show) {
                document.getElementById('open-inv-btn').style.visibility = 'visible';
            }
        }

        // 基本数値計算
        function getBaseCooldown() {
            return Math.max(200, 1000 - (state.upgrades.speed * 80)); 
        }

        function getLuckMultiplier() {
            return 1 + (state.upgrades.luck * 0.25);
        }

        function getUpgradeCost(type) {
            const lv = state.upgrades[type];
            if (type === 'speed') return Math.floor(10 * Math.pow(1.6, lv));
            if (type === 'luck') return Math.floor(15 * Math.pow(1.7, lv));
        }

        // 画面の表示更新
        function updateUI() {
            document.getElementById('total-rolls-display').innerText = `⭐ Total Rolls: ${state.rolls.toLocaleString()}`;
            document.getElementById('best-roll-display').innerText = `👑 Best: ${state.bestRollVal}`;
            
            // アップグレードパネル表示
            document.getElementById('speed-level').innerText = `Lv.${state.upgrades.speed}`;
            document.getElementById('buy-speed-btn').innerText = `コスト: ${getUpgradeCost('speed').toLocaleString()} Rolls`;
            document.getElementById('buy-luck-btn').innerText = `コスト: ${getUpgradeCost('luck').toLocaleString()} Rolls`;
            document.getElementById('luck-level').innerText = `Lv.${state.upgrades.luck} (幸運: +${Math.round((getLuckMultiplier()-1)*100)}%)`;

            // インベントリリスト生成
            const invList = document.getElementById('inventory-list');
            invList.innerHTML = '';
            pool.forEach(p => {
                const count = state.inventory[p.value] || 0;
                if (count > 0) {
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.style.borderLeft = `5px solid ${p.color}`;
                    row.innerHTML = `<span style="color:${p.color}; font-weight:bold;">${p.value}</span> : ${count.toLocaleString()} 個`;
                    invList.appendChild(row);
                }
            });
        }

        // アップグレード購入
        function buyUpgrade(type) {
            const cost = getUpgradeCost(type);
            if (state.rolls >= cost) {
                state.rolls -= cost;
                state.upgrades[type]++;
                saveGame();
                updateUI();
            } else {
                alert("ロール回数が足りません！");
            }
        }

        // ガチャのコアロジック
        function triggerRoll() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('roll-btn').disabled = true;

            state.rolls++;
            
            // ガチャ確率計算 (Luck適用)
            const luck = getLuckMultiplier();
            let rolledItem = pool[pool.length - 1]; // デフォルトは1

            for (let i = 0; i < pool.length; i++) {
                let finalChance = pool[i].chance * luck;
                if (Math.random() < finalChance) {
                    rolledItem = pool[i];
                    break;
                }
            }

            // データ更新保存
            state.inventory[rolledItem.value] = (state.inventory[rolledItem.value] || 0) + 1;
            if (rolledItem.numeric > state.bestRollNum) {
                state.bestRollNum = rolledItem.numeric;
                state.bestRollVal = rolledItem.value;
            }
            
            saveGame();

            // 演出とアニメーション表示
            const display = document.getElementById('result-number');
            display.innerText = rolledItem.value;
            display.style.color = rolledItem.color;
            display.style.textShadow = `0 0 25px ${rolledItem.color}`;
            
            const card = document.getElementById('result-card');
            card.style.animation = 'none';
            card.offsetHeight; // リフロートリガー
            card.style.animation = 'popIn 0.2s ease-out';

            updateUI();

            // クールダウンゲージのアニメーション
            const cdTime = getBaseCooldown();
            const bar = document.getElementById('cooldown-bar');
            bar.style.transition = 'none';
            bar.style.width = '100%';
            bar.offsetHeight;
            bar.style.transition = `width ${cdTime}ms linear`;
            bar.style.width = '0%';

            setTimeout(() => {
                isRolling = false;
                document.getElementById('roll-btn').disabled = false;
                if (isAuto) runAutoStep();
            }, cdTime);
        }

        // オートロール制御
        function toggleAuto() {
            isAuto = !isAuto;
            const btn = document.getElementById('auto-btn');
            if (isAuto) {
                btn.innerText = "AUTO: ON";
                btn.classList.add('active');
                if (!isRolling) runAutoStep();
            } else {
                btn.innerText = "AUTO: OFF";
                btn.classList.remove('active');
            }
        }

        function runAutoStep() {
            if (!isAuto) return;
            triggerRoll();
        }

        // 初期起動
        loadGame();
    </script>
</body>
</html>
